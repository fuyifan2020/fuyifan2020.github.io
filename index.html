<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fu Yifan's Blog</title>
  <meta name="description" content="FuYifan 的个人博客 —— 关于设计、生活与思考的随笔。" />

  <!-- 字体：中文衬线/无衬线，保证跨平台的一致质感 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/style.css" />
  <noscript>
    <style>.reveal { opacity: 1 !important; transform: none !important; filter: none !important; }</style>
  </noscript>
</head>
<body>

  <canvas id="particles" class="particles-canvas" aria-hidden="true"></canvas>

  <header class="site-header">
    <div class="wrap nav">
      <a class="brand-mark" href="index.html" aria-label="FuYifan 首页"><span>F</span></a>

      <nav class="nav-links">
        <a href="index.html">文章</a>
        <a href="about.html">关于</a>
      </nav>

      <a class="nav-cta" href="https://github.com/fuyifan2020" target="_blank" rel="noopener">GitHub</a>

      <button class="nav-toggle" type="button" aria-label="菜单" aria-expanded="false" aria-controls="nav-sheet">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="nav-overlay" hidden></div>
  <div class="nav-sheet" id="nav-sheet" hidden>
    <nav>
      <a href="index.html">文章</a>
      <a href="about.html">关于</a>
    </nav>
    <a class="sheet-cta" href="https://github.com/fuyifan2020" target="_blank" rel="noopener">GitHub</a>
  </div>

  <main>
    <section class="hero wrap">
      <h1 class="hero-title">Fu Yifan's Blog</h1>
      <div class="rule reveal" style="--d:.2s"></div>
    </section>

    <!-- 博客数据：无 JS 时显示下方静态兜底值 -->
    <section class="stats wrap reveal" style="--d:.28s" aria-label="博客数据">
      <div class="stat">
        <span class="stat-icon">#</span>
        <span class="stat-value" data-count="2" data-decimals="0">2</span>
        <span class="stat-label">篇文章</span>
      </div>
      <div class="stat">
        <span class="stat-icon">*</span>
        <span class="stat-value" data-count="1" data-decimals="0">1</span>
        <span class="stat-label">个分类</span>
      </div>
      <div class="stat">
        <span class="stat-icon">&lt;</span>
        <span class="stat-value" data-count="5" data-decimals="0">5</span>
        <span class="stat-label">分钟阅读</span>
      </div>
      <div class="stat">
        <span class="stat-icon">^</span>
        <span class="stat-value" data-static="1">2026-08</span>
        <span class="stat-label">最近更新</span>
      </div>
    </section>

    <section class="wrap">
      <div class="section-title reveal">
        <h2>最新文章</h2>
        <span class="count" id="post-count">—</span>
      </div>
      <!-- 文章列表由 js/main.js 依据 js/posts.js 渲染 -->
      <div class="post-list" id="post-list"></div>
      <noscript>
        <p style="color:var(--muted)">请开启 JavaScript 以查看文章列表，或前往 <a href="about.html" style="color:var(--text)">关于页</a>。</p>
      </noscript>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>
        <a href="index.html">文章</a> &nbsp;·&nbsp;
        <a href="about.html">关于</a> &nbsp;·&nbsp;
        <a href="https://github.com/fuyifan2020" target="_blank" rel="noopener">GitHub</a>
      </span>
    </div>
  </footer>

  <script src="js/posts.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
