<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fu Yifan's Blog</title>
  <meta name="description" content="FuYifan 的个人博客 —— 关于设计、生活与思考的随笔。" />

  <!-- 字体：中文衬线/无衬线，保证跨平台的一致质感 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="index.html">FuYifan<span class="dot">.</span></a>
      <button class="nav-toggle" aria-label="菜单"><span></span><span></span><span></span></button>
      <nav class="nav-links">
        <a href="index.html">文章</a>
        <a href="about.html">关于</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero wrap">
      <p class="eyebrow reveal">Personal Journal &middot; 随笔与思考</p>
      <h1 class="reveal hero-title">Fu Yifan's Blog</h1>
      <div class="rule reveal"></div>
    </section>

    <section class="wrap">
      <div class="section-title reveal">
        <h2>最新文章</h2>
        <span class="count" id="post-count">—</span>
      </div>
      <!-- 文章列表由 js/main.js 依据 js/posts.js 渲染 -->
      <div class="post-list" id="post-list"></div>
      <noscript>
        <p style="color:var(--text-muted)">请开启 JavaScript 以查看文章列表，或前往 <a href="about.html" style="color:var(--gold)">关于页</a>。</p>
      </noscript>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>
        <a href="index.html">文章</a> &nbsp;·&nbsp;
        <a href="about.html">关于</a> &nbsp;·&nbsp;
        <a href="https://github.com/fuyifan2020" target="_blank" rel="noopener">GitHub</a>
      </span>
    </div>
  </footer>

  <script src="js/posts.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
